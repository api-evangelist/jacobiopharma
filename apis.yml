name: Jacobio Pharma
description: >-
  Jacobio Pharma (Jacobio Pharmaceutica) is a clinical-stage biopharmaceutical company focused on
  discovering and developing novel small-molecule cancer therapies against historically "undruggable"
  oncology targets. Its pipeline spans 10+ clinical programs across six major tumor signaling pathways
  (including p53, RAS, RB, MYC, immune checkpoints, and tumor metabolism), advanced through proprietary
  allosteric drug-discovery and iADC platforms, more than 300 global patent applications, and 100+
  clinical centers worldwide. Surfaced as a portfolio company of the venture firm Qiming and added to
  the API Evangelist network; it publishes a corporate website but no public API or developer surface.
